<script>
// ---- NL: natural liquids (Beer–Lambert colour, absorbance mixing, depth shading, mixing plumes) + digital readouts ----
// Shared by every bench. All drawing functions take the canvas context explicitly.
var NL = window.NL || (window.NL = (() => {
  const BG = [251, 251, 248]; // white tile / white card behind the vessel
  const parse = c => { if (Array.isArray(c)) return c.slice(0, 3); if (c[0] === "#") return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const m = String(c).match(/[\d.]+/g) || [255, 255, 255]; return [+m[0], +m[1], +m[2]]; };
  // absorbance per channel of a colour seen through the reference depth (k = 1) against the white background
  const A = c => parse(c).map((v, i) => -Math.log10(Math.max(2, Math.min(BG[i], v)) / BG[i]));
  const fromA = (a, k = 1) => `rgb(${a.map((x, i) => Math.round(BG[i] * Math.pow(10, -x * k))).join(",")})`;
  const depth = (c, k) => fromA(A(c), k);
  // mixing two solutions (or partial conversion of one coloured species into another): absorbances add, like real dyes
  const mixA = (c1, c2, f) => { const a = A(c1), b = A(c2); f = Math.max(0, Math.min(1, f)); return fromA(a.map((v, i) => v * (1 - f) + b[i] * f)); };
  // sum of several coloured species with weights (e.g. [["#7A4A12", 0.3], ["#14143C", 0.7]])
  const sumA = parts => { const s = [0, 0, 0]; parts.forEach(([c, w]) => A(c).forEach((v, i) => s[i] += v * w)); return fromA(s); };

  function liquid(ctx, path, x0, x1, lvl, base, col, opt = {}) {
    const a = A(col), h = Math.max(1, base - lvl), w = x1 - x0;
    ctx.save(); path(); ctx.closePath(); ctx.clip(); ctx.globalAlpha = opt.alpha ?? 1;
    // deeper liquid looks darker (Beer–Lambert): lighter just under the surface, deepest at the bottom
    const g = ctx.createLinearGradient(0, lvl, 0, base); g.addColorStop(0, fromA(a, opt.kTop ?? .78)); g.addColorStop(.5, fromA(a, 1)); g.addColorStop(1, fromA(a, opt.kBot ?? 1.5));
    ctx.fillStyle = g; ctx.fillRect(x0, lvl, w, h + 3);
    // curved glass: darker towards the walls, a soft light band on the left
    const s = ctx.createLinearGradient(x0, 0, x1, 0);
    s.addColorStop(0, "rgba(0,0,0,.18)"); s.addColorStop(.16, "rgba(255,255,255,.12)"); s.addColorStop(.3, "rgba(255,255,255,0)"); s.addColorStop(.72, "rgba(0,0,0,0)"); s.addColorStop(1, "rgba(0,0,0,.16)");
    ctx.fillStyle = s; ctx.fillRect(x0, lvl, w, h + 3);
    if (opt.hatch) { ctx.fillStyle = opt.hatch; ctx.fillRect(x0, lvl, w, h + 3); }
    if (opt.surface !== false) { // liquid surface seen slightly from above, tilting when swirled
      const cx = opt.cx ?? (x0 + x1) / 2, rx = opt.rx ?? w / 2, ry = Math.min(3.6, Math.max(1.3, rx * .09));
      ctx.fillStyle = fromA(a, .5); ctx.beginPath(); ctx.ellipse(cx, lvl, rx, ry, opt.tilt || 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = .8; ctx.stroke(); }
    ctx.restore();
  }

  // a drop of reagent spreading and reacting: radial clouds that grow, sink, swirl and fade
  class Plumes {
    constructor() { this.p = []; }
    spawn(x, y, col, s = 1, r = 4) { this.p.push({ x, y, col: parse(col), s: Math.min(1.4, s), r, age: 0, ph: Math.random() * 6 }); if (this.p.length > 60) this.p.shift(); }
    step(dt, k = 1, swirl = false, t = 0, floorY = 1e9) { for (let i = this.p.length - 1; i >= 0; i--) { const p = this.p[i]; p.age += dt;
      p.r += (swirl ? 46 : 12) * dt / (1 + p.age); p.y = Math.min(floorY - p.r * .4, p.y + (swirl ? 30 : 16) * dt / (1 + p.age * .6));
      if (swirl) p.x += Math.sin(t * 5.2 + p.ph) * 34 * dt; p.s *= Math.exp(-k * dt); if (p.s < .02) this.p.splice(i, 1); } }
    draw(ctx, path, dx = 0, topY = -1e9) { if (!this.p.length) return; ctx.save(); path(); ctx.closePath(); ctx.clip(); ctx.beginPath(); ctx.rect(-1e4, topY, 2e4, 2e4); ctx.clip();
      this.p.forEach(p => { const a = Math.min(.92, p.s * .9), c = p.col.join(","), g = ctx.createRadialGradient(p.x + dx, p.y, 0, p.x + dx, p.y, p.r);
        g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(.6, `rgba(${c},${a * .45})`); g.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(p.x + dx, p.y, p.r * 1.25, p.r, 0, 0, 7); ctx.fill(); });
      ctx.restore(); }
    clear() { this.p = []; }
    get active() { return this.p.length > 0; }
  }

  // ---- digital readout toggle (remembered across practicals) ----
  let dig = false; try { dig = localStorage.getItem("svl-digital") === "1"; } catch (e) {}
  const DL = { en: "Digital readout", si: "ඩිජිටල් කියවීම", ta: "இலக்க வாசிப்பு" };
  function mountDigital(onChange, where) {
    if (document.getElementById("nlDig")) return;
    if (!document.getElementById("nlDigCss")) { const st = document.createElement("style"); st.id = "nlDigCss";
      st.textContent = ".nl-dig{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line,#d9d3c5);border-radius:999px;font-weight:500;cursor:pointer;user-select:none;background:var(--surface,#fff);color:var(--ink,#162127)}.nl-dig input{width:18px;height:18px;accent-color:var(--accent,#6D4AD6);margin:0}.nl-dig:focus-within{outline:3px solid #FFC857;outline-offset:2px}.nl-dig.fixed{position:absolute;right:12px;bottom:12px;z-index:5;min-height:38px;font-size:13px}";
      document.head.appendChild(st); }
    const lab = document.createElement("label"); lab.className = "nl-dig"; lab.innerHTML = '<input type="checkbox" id="nlDig"><span></span>';
    const bar = where ? document.querySelector(where) : document.querySelector(".modebar");
    if (bar) { const sp = bar.querySelector('span[style*="flex:1"]'); bar.insertBefore(lab, sp ? sp.nextSibling : null); }
    else { const vp = document.getElementById("viewport") || document.body; lab.classList.add("fixed"); vp.appendChild(lab); }
    const cb = lab.querySelector("input"); cb.checked = dig;
    const setL = () => { const l = document.documentElement.lang; lab.querySelector("span").textContent = DL[l] || DL.en; };
    setL(); new MutationObserver(setL).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    cb.onchange = () => { dig = cb.checked; try { localStorage.setItem("svl-digital", dig ? "1" : "0"); } catch (e) {} onChange && onChange(dig); };
  }
  // small LCD panel: x = centre, y = top
  function lcd(ctx, x, y, txt, opt = {}) {
    const size = opt.size || 14; ctx.save(); ctx.font = `600 ${size}px 'IBM Plex Mono', ui-monospace, monospace`;
    const tw = Math.max(ctx.measureText(txt).width, opt.minW || 0), w = tw + 20, h = size + 14, bx = x - w / 2;
    ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; ctx.fillStyle = "#1f2a33"; ctx.beginPath(); ctx.roundRect(bx, y, w, h, 6); ctx.fill(); ctx.shadowColor = "transparent";
    const g = ctx.createLinearGradient(0, y + 3, 0, y + h - 3); g.addColorStop(0, "#d3e4cc"); g.addColorStop(1, "#b2cba9"); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(bx + 4, y + 3, w - 8, h - 6, 3); ctx.fill();
    ctx.fillStyle = "rgba(18,38,27,.12)"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt.replace(/[0-9]/g, "8"), x, y + h / 2 + 1);
    ctx.fillStyle = "#12261b"; ctx.fillText(txt, x, y + h / 2 + 1);
    if (opt.cap) { ctx.font = "600 9px 'IBM Plex Sans','Noto Sans Sinhala','Noto Sans Tamil',sans-serif"; ctx.fillStyle = opt.capCol || "#1c2a31"; ctx.textBaseline = "alphabetic"; ctx.fillText(opt.cap, x, y - 4); }
    ctx.restore(); return { w, h };
  }
  return { parse, A, fromA, depth, mixA, sumA, liquid, Plumes, mountDigital, lcd, get digital() { return dig; } };
})());
</script>

  if (["na", "ca", "mgh"].includes(rsel)) {
    const max = rsel === "na" ? 1 : rsel === "ca" ? .8 : .25, milky = rsel === "ca" ? .5 * f : 0, pk = max * Math.min(1, f * 1.2);
    mctx.strokeStyle = "#7a9aa8"; mctx.lineWidth = 4; mctx.fillStyle = liquidCol(pk, milky); mctx.fillRect(184, 110, 232, 210); mctx.fillStyle = mctx.createPattern(makeHatchCanvas(), "repeat"); if (pk < .1) mctx.fillRect(184, 110, 232, 210);
    if (rsel === "na" && f > .05 && f < .7) { for (let i = 0; i < 8; i++) { const g = mctx.createRadialGradient(220 + i * 24, 140 + (i % 3) * 30, 2, 220 + i * 24, 140 + (i % 3) * 30, 20 + f * 60); g.addColorStop(0, "rgba(224,85,155,.6)"); g.addColorStop(1, "rgba(224,85,155,0)"); mctx.fillStyle = g; mctx.fillRect(184, 110, 232, 210); } }
    mctx.beginPath(); mctx.moveTo(180, 60); mctx.lineTo(180, 322); mctx.lineTo(420, 322); mctx.lineTo(420, 60); mctx.stroke();
    name = f < .08 ? t("sColourless") : rsel === "na" ? (f < .7 ? t("sStreaks") : t("sPink")) : rsel === "ca" ? t("sMilky") : t("sFaint");
  } else if (rsel === "cut") { mctx.fillStyle = mix(SHINY, DULL, f); mctx.strokeStyle = "#6f6c62"; mctx.lineWidth = 3; mctx.beginPath(); mctx.roundRect(170, 100, 260, 200, 20); mctx.fill(); mctx.stroke(); if (f < .3) { mctx.fillStyle = "rgba(255,255,255,.7)"; mctx.fillRect(195, 120, 18, 160); }
    name = (f < .2 ? t("sShiny") : f < .8 ? t("sTarn") : t("sDull")) + " · " + (f * 5).toFixed(1) + " min";
  } else { if (f < .25) { mctx.fillStyle = "#8f9599"; mctx.fillRect(120, 190, 360, 18); name = t("sGrey"); }
    else if (f < .7) { mctx.fillStyle = "#1c2a31"; mctx.fillRect(0, 0, w, h); mctx.fillStyle = "#8f9599"; mctx.fillRect(120, 190, 360 * (1 - (f - .25) / .45), 18); const g = mctx.createRadialGradient(120 + 360 * (1 - (f - .25) / .45), 199, 4, 300, 199, 260); g.addColorStop(0, "#ffffff"); g.addColorStop(.3, "rgba(255,255,240,.9)"); g.addColorStop(1, "rgba(255,255,255,0)"); mctx.fillStyle = g; mctx.fillRect(0, 0, w, h); name = t("sFlame"); }
    else { mctx.fillStyle = "#f7f7f4"; mctx.strokeStyle = "#cfcbbf"; mctx.beginPath(); mctx.ellipse(300, 260, 140, 40, 0, Math.PI, 0); mctx.fill(); mctx.stroke(); mctx.fillStyle = "#6c6a64"; mctx.fillRect(140, 260, 320, 14); name = t("sAsh"); } }
  lab(name); $("rname").textContent = name;
}
let hc = null; function makeHatchCanvas() { if (hc) return hc; hc = document.createElement("canvas"); hc.width = hc.height = 16; const x = hc.getContext("2d"); x.strokeStyle = "rgba(60,90,110,.35)"; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 16); x.lineTo(16, 0); x.stroke(); return hc; }
function renderReplayCtl() { const ok = !!S.rec[rsel]; $("replay").disabled = !ok; $("playBtn").disabled = !ok; $("playBtn").textContent = t(playing ? "pause" : "play"); }
// quiz
function readScores() { try { return JSON.parse(localStorage.getItem("svl-scores") || "{}") || {}; } catch (e) { return {}; } }
function saveScore(pct) { try { const s = readScores(); if (!(s[SIM_ID] >= pct)) { s[SIM_ID] = pct; localStorage.setItem("svl-scores", JSON.stringify(s)); } } catch (e) {} }
function renderQuiz() { const Q = t("quiz"), L = ["A", "B", "C", "D"];
  $("quiz").innerHTML = Q.map((q, i) => `<div class="q" id="q${i}"><p>${i + 1}. ${esc(q.q)}</p>${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${L[j]}) ${esc(o)}</button>`).join("")}<div class="exp"></div></div>`).join("");
  Object.entries(S.answered).forEach(([i, j]) => markAnswer(+i, j)); score(); }
function markAnswer(i, j) { const ok = j === QUIZ_ANS[i];
  $("q" + i).querySelectorAll("button").forEach((x, k) => { x.disabled = true; if (k === QUIZ_ANS[i]) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
  const d = document.createElement("div"); d.className = "note " + (ok ? "ok" : "bad"); d.textContent = t(ok ? "correct" : "notQuite") + t("quiz")[i].e; const ex = $("q" + i).querySelector(".exp"); ex.innerHTML = ""; ex.append(d); }
$("quiz").onclick = e => { const b = e.target.closest("button[data-q]"); if (!b) return; const i = +b.dataset.q, j = +b.dataset.o; if (i in S.answered) return; S.answered[i] = j; markAnswer(i, j); score(); };
function score() { const n = Object.keys(S.answered).length, s = Object.entries(S.answered).filter(([i, j]) => j === QUIZ_ANS[+i]).length, N = QUIZ_ANS.length;
  if (n === N) saveScore(Math.round(s / N * 100)); const best = readScores()[SIM_ID];
  $("score").textContent = `${s} / ${N}` + (n < N ? " · " + t("scoreLeft", { n: N - n }) : "") + (best !== undefined ? " · " + t("best", { p: best }) : ""); }
$("retryBtn").onclick = () => { S.answered = {}; renderQuiz(); };
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  cv.setAttribute("aria-label", t("canvasAria"));
  $("appList").innerHTML = t("app").map(a => `<span>${esc(a)}</span>`).join(""); $("safeList").innerHTML = t("safe").map(a => `<li>${esc(a)}</li>`).join("");
  try { const st = JSON.parse(localStorage.getItem("svl-student") || "null"); if (st && st.name) { $("student").hidden = false; $("student").textContent = t("student", { name: st.name, cls: st.cls ? " · " + st.cls : "" }); } } catch (e) {}
}
function fullRender() { applyStatic(); render(); renderLog(); renderQuiz(); }
function applyLang(l) { LANG = l; try { localStorage.setItem("svl-lang", l); } catch (e) {} fullRender(); }
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
document.querySelectorAll("#stSeg button").forEach(b => b.onclick = () => switchSt(b.dataset.st));
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["guide", "obs", "colours", "quiz"].forEach(id => $("pane-" + id).hidden = id !== b.dataset.tab);
  if (b.dataset.tab === "quiz") b.classList.remove("ping"); if (b.dataset.tab === "colours") { renderReplayCtl(); drawMini(); } });
$("gogBtn").onclick = () => { S.gog = !S.gog; render(); };
$("rsel").onchange = e => { rsel = e.target.value; playing = false; $("replay").value = 1000; renderReplayCtl(); drawMini(); };
$("resetBtn").onclick = () => { const ans = S.answered; S = freshState(); S.answered = ans; flash = 0; $("quizTab").classList.remove("ping"); fullRender(); };
$("replay").oninput = () => { playing = false; renderReplayCtl(); drawMini(); };
$("playBtn").onclick = () => { playing = !playing; if (playing && +$("replay").value >= 1000) $("replay").value = 0; renderReplayCtl(); };

readTokens(); resize(); S = freshState(); fullRender();
requestAnimationFrame(frame);
})();
