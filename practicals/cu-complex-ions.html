<style>

  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.5); --scale-ink:#1c2a31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.5); --scale-ink:#1c2a31;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top > div:first-child{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
:lang(si) .eyebrow,:lang(ta) .eyebrow{letter-spacing:.02em;font-size:12.5px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
:lang(si) h1,:lang(ta) h1{letter-spacing:0;font-size:clamp(22px,2.6vw,32px);line-height:1.3}
.eqn{font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.eqn b{color:var(--accent);font-weight:500}
.top-actions{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.student{font-size:13px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.next{border-color:var(--current);box-shadow:0 0 0 3px color-mix(in srgb,var(--current) 30%,transparent)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.hold{touch-action:none;user-select:none;-webkit-user-select:none}
.btn.hold.active{background:var(--accent);color:var(--on-accent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prompt{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.prompt .dot{width:9px;height:9px;border-radius:50%;background:var(--current);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--current) 25%,transparent)}
.prompt p{margin:0;font-weight:500;min-width:0}
.viewport{position:relative;height:clamp(380px,calc(100vh - 360px),640px);background:var(--wall-bot)}
@media (max-width:980px){.viewport{height:clamp(320px,60vw,560px)}}
canvas#cv{display:block;width:100%;height:100%;touch-action:manipulation}
.chips{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.chip{font-family:var(--f-mono);font-size:12.5px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);width:max-content;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.toast.party{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);font-weight:600}

.dock{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
:lang(si) .row .label,:lang(ta) .row .label{letter-spacing:0;font-size:12.5px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:42px;font-size:14px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lang button{min-height:36px}
.lang button[lang="si"]{font-family:"Noto Sans Sinhala",var(--f-body)}
.lang button[lang="ta"]{font-family:"Noto Sans Tamil",var(--f-body)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:14px;max-width:100%}
.spacer{flex:1}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.selinfo{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.selinfo .sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex:none}
.selinfo .sw.ppt{background-image:radial-gradient(circle,rgba(0,0,0,.18) 1.2px,transparent 1.6px);background-size:6px 6px}
.selinfo .txt{display:flex;flex-direction:column;min-width:0;font-size:14px}
.selinfo .txt b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:12px 4px;min-height:46px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;line-height:1.3;position:relative}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button.ping::after{content:"";position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--current)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:980px){.pane{max-height:none}}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.005em}
:lang(si) h2,:lang(ta) h2{letter-spacing:0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
:lang(si) h3,:lang(ta) h3{letter-spacing:0;font-size:13px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.box.safety{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.box.safety h3{color:var(--warn)}
.box.safety ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
.eqs{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:12.5px;overflow-x:auto}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.steps li .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:var(--muted);margin-top:2px}
.steps li.done{color:var(--muted)}
.steps li.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps li.now{background:var(--surface);border-color:var(--current)}
.steps li.now .tick{border-color:var(--current);color:var(--current)}

.log{font-size:13.5px;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}
.log > div{display:grid;grid-template-columns:58px 1fr;gap:6px}
.log span{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;padding-top:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--surface-2);font-weight:600;vertical-align:bottom}
:lang(si) th,:lang(ta) th{letter-spacing:0;font-size:12px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-family:var(--f-mono);font-weight:500}

.cc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.cc .ttl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.cc .ttl em{font-style:normal;font-weight:500;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cc .ttl em.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cc .flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.cc .st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;min-width:0}
.cc .st small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
:lang(si) .cc .st small,:lang(ta) .cc .st small{letter-spacing:0}
.cc .sw{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 -8px 12px rgba(0,0,0,.08)}
.cc .sw.ppt{background-image:radial-gradient(circle,rgba(40,80,120,.35) 1.4px,transparent 1.8px);background-size:7px 7px}
.cc .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding-top:14px;max-width:110px;text-align:center}
.cc .arrow b{font-size:20px;color:var(--ink);line-height:1}
.cc .via{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.cc .via i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.replay{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.replay canvas{width:110px;height:230px;border-radius:10px;background:#ffffff;border:1px solid var(--line)}
.replay .ctl{display:flex;flex-direction:column;gap:8px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);min-height:30px}
.rname{font-size:14px;font-weight:600}

.q{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.q p{margin:0 0 4px;font-weight:600}
.q button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:14px}
.q button:hover:not(:disabled){border-color:var(--accent)}
.q button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.q button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q button:disabled{cursor:default}
.note{font-size:13px;padding:8px 10px;border-radius:8px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const HEX = { blue: "#4BA3E3", deep: "#1F3FB4", yg: "#B5C94A", ppt: "#A9D3F2", base: [252, 252, 250] };
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const absOf = h => hexRGB(h).map((v, i) => -Math.log10(Math.max(3, v) / HEX.base[i]));
const A_BLUE = absOf(HEX.blue), A_DEEP = absOf(HEX.deep), A_YG = absOf(HEX.yg);
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const clamp01 = x => Math.max(0, Math.min(1, x));
const MIX_GREEN = (() => { const a = [0, 1, 2].map(i => 0.5 * A_BLUE[i] + 0.5 * A_YG[i]); return a.map((v, i) => HEX.base[i] * 10 ** -v); })();

// model: 2 cm³ of 0.10 M Cu²⁺ = 0.20 mmol. NH₃ 2 M (0.10 mmol per drop). Conc. HCl 12 M (0.60 mmol Cl⁻ per drop).
function chem(tb) {
  if (tb.V <= 0) return null;
  const s = Math.sqrt(2 / tb.V);
  let fb = 1, fc = 0, fy = 0, ppt = 0, p = 0, d = 0, x = 0;
  if (tb.id === "A") { p = clamp01(tb.nh3 / 0.4); d = clamp01((tb.nh3 - 0.4) / 1.0); ppt = p * (1 - d); fb = 1 - p; fc = p * d; }
  if (tb.id === "B") { const c = tb.cl / tb.V, c4 = c ** 4; x = c4 / (c4 + 81); fb = 1 - x; fy = x; }
  const rgb = [0, 1, 2].map(i => HEX.base[i] * 10 ** -(s * (fb * A_BLUE[i] + fc * A_DEEP[i] + fy * A_YG[i])));
  let name = "nBlue";
  if (tb.id === "A") name = fc >= 0.55 ? "nDeepBlue" : (ppt > 0.05 && fb < 0.5) ? "nPaleBlue" : "nBlue";
  if (tb.id === "B") name = x < 0.25 ? "nBlue" : x < 0.72 ? "nGreen" : "nYG";

}

  const tb = S.tubes[S.sel], info = chem(tb);
  let h;
  if (!info) h = `<span class="sw" style="background:transparent"></span><span class="txt"><b>${t("selTube", { t: S.sel, v: "0.0" })}</b><span>${t("emptyTube")}</span></span>`;
  else h = `<span class="sw" style="background:${css(tb.disp)}"></span><span class="txt"><b>${t("selTube", { t: S.sel, v: tb.V.toFixed(1) })}</b><span>${t("solution", { c: t(info.name) })}</span></span>`
    + (info.pptName ? `<span class="sw ppt" style="background-color:${HEX.ppt}"></span><span class="txt"><span>${t("ppt", { c: t(info.pptName) })}</span></span>` : `<span class="txt muted"><span>${t("noPpt")}</span></span>`);
  if ($("selinfo").innerHTML !== h) $("selinfo").innerHTML = h;
  const p = phase(); const pt = promptText(p); if ($("prompt").textContent !== pt) render();
}

// colour cards
const CARDS = [
  { id: "c1", tube: "A", b: ["nBlue", HEX.blue, false], r: "tR1", a: ["nPalePpt", HEX.ppt, true], via: null },
  { id: "c2", tube: "A", b: ["nPalePpt", HEX.ppt, true], r: "tR2", a: ["nDeepBlue", HEX.deep, false], via: ["nPptDissolving", "#7fa6d8"] },
  { id: "c3", tube: "B", b: ["nBlue", HEX.blue, false], r: "tR3", a: ["nYG", HEX.yg, false], via: ["nGreen", css(MIX_GREEN)] },
  { id: "c4", tube: "B", b: ["nYG", HEX.yg, false], r: "tR4", a: ["nBlue", HEX.blue, false], via: ["nGreen", css(MIX_GREEN)] },
];
function renderCards() {
  $("cards").innerHTML = CARDS.map(c => { const rec = S.seg[c.id].end !== null;
    const st = (lab, [k, col, ppt]) => `<div class="st"><small>${t(lab)}</small><span class="sw${ppt ? " ppt" : ""}" style="background-color:${col}"></span><span>${t(k)}</span></div>`;
    return `<div class="cc"><div class="ttl"><span>${t("tubeL")} ${c.tube}</span><em class="${rec ? "ok" : ""}">${rec ? "✓ " + t("seen") : t("notYet")}</em></div>
      <div class="flow">${st("before", c.b)}<div class="arrow"><b>→</b><span>${t(c.r)}</span></div>${st("after", c.a)}</div>
      ${c.via ? `<div class="via"><i style="background:${c.via[1]}"></i>${t("via", { c: t(c.via[0]) })}</div>` : ""}</div>`; }).join("");
}
// replay
const mini = $("mini"), mctx = mini.getContext("2d");
let playing = false;
function renderReplaySel() { const v = $("replaySel").value || "c1"; $("replaySel").innerHTML = CARDS.map(c => `<option value="${c.id}">${t("tubeL")} ${c.tube}: ${t(c.b[0])} → ${t(c.a[0])}</option>`).join(""); $("replaySel").value = v; }
function seeded(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function renderReplay() {
  const id = $("replaySel").value || "c1", sg = S.seg[id], tb = S.tubes[sg.tube];
  const ok = sg.start !== null && sg.end !== null && sg.end > sg.start;
  $("replay").disabled = !ok; $("playBtn").disabled = !ok; $("playBtn").textContent = t(playing ? "pause" : "play");
  $("rhint").textContent = ok ? t("replayHint") : t("replayNone");
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.fillStyle = "#ffffff"; mctx.fillRect(0, 0, mini.width, mini.height);
  const s = 1.25; mctx.setTransform(s, 0, 0, s, mini.width / 2 - TX.A * s, -G.top * s + 40);
  if (!ok) { drawTube(mctx, TX.A, 0, HEX.base, [], 0, []); $("rname").textContent = ""; return; }
  const idx = Math.round(sg.start + (+$("replay").value / 1000) * (sg.end - sg.start)), h = tb.hist[Math.max(0, Math.min(tb.hist.length - 1, idx))];
  const parts = []; const ly = levelY(h.V);
  for (let i = 0; i < h.s; i++) { const y = ly + 6 + seeded(i) * (G.bot - ly - 12); const hw = halfW(y); parts.push({ x: (seeded(i + 500) * 2 - 1) * hw, y, s: 1.3, a: 0.9 }); }
  for (let i = 0; i < h.d; i++) { const y = G.bot - 2.5 - seeded(i + 900) * (3 + h.d * 0.09); const hw = halfW(y); parts.push({ x: (seeded(i + 1300) * 2 - 1) * hw, y, s: 1.3, a: 0.95 }); }
  drawTube(mctx, TX.A, h.V, h.c, parts, (h.s / MAXP) * 0.9, []);
  $("rname").textContent = t("solution", { c: t(h.n) }) + (h.pn ? " · " + t("ppt", { c: t(h.pn) }) : "");
}
let playRAF = 0;
function togglePlay() {
  playing = !playing; renderReplay(); cancelAnimationFrame(playRAF);
  if (!playing) return; if (+$("replay").value >= 1000) $("replay").value = 0;
  let lt = performance.now(); const id = $("replaySel").value, sg = S.seg[id], dur = Math.max(3, (sg.end - sg.start) * 0.08 * 2);
  const tick = now => { const dt = (now - lt) / 1000; lt = now; const v = Math.min(1000, +$("replay").value + dt / dur * 1000); $("replay").value = v; renderReplay(); if (v < 1000 && playing) playRAF = requestAnimationFrame(tick); else { playing = false; renderReplay(); } };
  playRAF = requestAnimationFrame(tick);
}

// quiz + scores
function readScores() { try { return JSON.parse(localStorage.getItem("svl-scores") || "{}") || {}; } catch (e) { return {}; } }
function saveScore(pct) { try { const s = readScores(); if (!(s[SIM_ID] >= pct)) { s[SIM_ID] = pct; localStorage.setItem("svl-scores", JSON.stringify(s)); } } catch (e) {} }
function renderQuiz() {
  const Q = t("quiz");
  $("quiz").innerHTML = Q.map((q, i) => `<div class="q" id="q${i}"><p>${i + 1}. ${q.q}</p>${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${o}</button>`).join("")}<div class="exp"></div></div>`).join("");
  Object.entries(S.answered).forEach(([i, j]) => markAnswer(+i, j)); score();
}
function markAnswer(i, j) {
  const ok = j === QUIZ_ANS[i];
  $("q" + i).querySelectorAll("button").forEach((x, k) => { x.disabled = true; if (k === QUIZ_ANS[i]) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
  const d = document.createElement("div"); d.className = "note " + (ok ? "ok" : "bad"); d.textContent = t(ok ? "correct" : "notQuite") + t("quiz")[i].e;
  const ex = $("q" + i).querySelector(".exp"); ex.innerHTML = ""; ex.append(d);
}
$("quiz").onclick = e => { const b = e.target.closest("button[data-q]"); if (!b) return; const i = +b.dataset.q, j = +b.dataset.o; if (i in S.answered) return; S.answered[i] = j; markAnswer(i, j); score(); };
function score() {
  const n = Object.keys(S.answered).length, s = Object.entries(S.answered).filter(([i, j]) => j === QUIZ_ANS[+i]).length, N = QUIZ_ANS.length;
  if (n === N) saveScore(Math.round(s / N * 100));
  const best = readScores()[SIM_ID];
  $("score").textContent = `${s} / ${N}` + (n < N ? " · " + t("scoreLeft", { n: N - n }) : "") + (best !== undefined ? " · " + t("best", { p: best }) : "");
}
$("retryBtn").onclick = () => { S.answered = {}; renderQuiz(); };

// static text + language
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $("appList").innerHTML = t("app").map(a => `<span>${a}</span>`).join("");
  $("safeList").innerHTML = t("safe").map(a => `<li>${a}</li>`).join("");
  try { const st = JSON.parse(localStorage.getItem("svl-student") || "null"); if (st && st.name) { $("student").hidden = false; $("student").textContent = t("student", { name: st.name, cls: st.cls ? " · " + st.cls : "" }); } } catch (e) {}
}
function renderAll() { applyStatic(); render(); renderLog(); renderTable(); renderCards(); renderReplaySel(); renderReplay(); renderQuiz(); }
function applyLang(l) { LANG = l; try { localStorage.setItem("svl-lang", l); } catch (e) {} renderAll(); }
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));

// tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["guide", "obs", "colours", "quiz"].forEach(id => $("pane-" + id).hidden = id !== b.dataset.tab);
  if (b.dataset.tab === "quiz") b.classList.remove("ping");
  if (b.dataset.tab === "colours") renderReplay();
});

// wiring
$("gogglesBtn").onclick = toggleGoggles; $("fumeBtn").onclick = toggleFume; $("fillBtn").onclick = fillTubes; $("resetBtn").onclick = reset;
$("tubeSel").onchange = e => selectTube(e.target.value);
document.querySelectorAll("#reagSeg button").forEach(b => b.onclick = () => selectReagent(b.dataset.r));
$("dropBtn").onclick = () => addOne();
const hb = $("holdBtn");
hb.addEventListener("pointerdown", e => { e.preventDefault(); try { hb.setPointerCapture(e.pointerId); } catch (_) {} if (addOne()) { S.holding = true; S.holdAcc = 0; hb.classList.add("active"); } });
["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => hb.addEventListener(ev, stopHold));
hb.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); if (addOne()) { S.holding = true; S.holdAcc = 0; hb.classList.add("active"); } } });
hb.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stopHold(); });
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - ox) / sc, y = (e.clientY - r.top - oy) / sc;
  for (const id of ["A", "B", "C"]) if (Math.abs(x - TX[id]) < 32 && y > G.top - 25 && y < G.bot + 20) return selectTube(id);
  for (const k of Object.keys(BOT_X)) if (Math.abs(x - BOT_X[k]) < 30 && y > 370 && y < 500) return selectReagent(k);
});
$("replaySel").onchange = () => { playing = false; $("replay").value = 0; renderReplay(); };
$("replay").oninput = () => { playing = false; renderReplay(); };
$("playBtn").onclick = togglePlay;
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === "a" || k === "b" || k === "c") selectTube(k.toUpperCase());
  else if (k === "1") selectReagent("nh3"); else if (k === "2") selectReagent("hcl"); else if (k === "3") selectReagent("water");
  else if (k === "d") addOne();
});

readTokens(); resize(); S = freshState(); renderAll();
requestAnimationFrame(frame);
})();
</script>
