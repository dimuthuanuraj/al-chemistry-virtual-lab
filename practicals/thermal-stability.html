function renderSafety() { $("sfGrid").innerHTML = t("sf").map(([h, b], i) => `<div class="sfcard">${SF_PHOTOS[i] ? `<img src="${SF_PHOTOS[i]}" alt="${esc(h)}" width="517" height="386">` : sfArt(i)}<div class="tx"><b><span class="num">${i + 1}</span>${esc(h)}</b><span>${esc(b)}</span></div></div>`).join(""); $("demoAv").innerHTML = avatarSvg(); }
function openSafety() { renderSafety(); $("sfModal").hidden = false; setTimeout(() => $("sfOk").focus(), 50); }
function closeSafety() { $("sfModal").hidden = true; }
$("sfBtn").onclick = openSafety;
$("sfOk").onclick = () => { S.gog = true; closeSafety(); render(); };
$("sfDemo").onclick = () => { closeSafety(); runDemo(); };
$("sfModal").addEventListener("keydown", e => { if (e.key === "Escape") closeSafety(); });
let demoId = 0;
async function runDemo() {
  const id = ++demoId, alive = () => id === demoId, wait = ms => new Promise(rs => setTimeout(rs, ms));
  const ans = S.answered; S = freshState(); S.answered = ans; S.demo = true; S.gog = true; fullRender();
  $("demoBar").hidden = false; $("demoBtn").disabled = true; $("demoAv").innerHTML = avatarSvg();
  const until = async (fn, max = 40000) => { const t0 = Date.now(); while (alive() && !fn() && Date.now() - t0 < max) await wait(150); };
  const script = [
    ["intro", null, 2500], ["mg", () => { pickSalt("MgCO3"); toggleLime(); onHeat(); }, 300], ["mgM", () => until(() => S.times.MgCO3 !== undefined), 1500],
    ["out", async () => { toggleLime(); await wait(900); offHeat(); }, 2500], ["ca", async () => { pickSalt("CaCO3"); toggleLime(); onHeat(); await until(() => S.times.CaCO3 !== undefined); toggleLime(); offHeat(); }, 1500],
    ["na", async () => { pickSalt("Na2CO3"); toggleLime(); onHeat(); await until(() => S.U.heatT >= 120); noChange(); toggleLime(); offHeat(); }, 1500],
    ["nit", async () => { pickSalt("MgNO3"); onHeat(); await until(() => S.U.brown > .6 && S.U.o2 > .35); splint(); }, 2500],
    ["nano", async () => { offHeat(); pickSalt("NaNO3"); onHeat(); await until(() => S.U.o2 > .4 && S.U.melt > .6); splint(); }, 2500],
    ["rank", async () => { S.rank = { 1: "0", 2: "0", 3: "0" }; render(); await wait(1200); checkRank(); }, 3500], ["bye", null, 2200],
  ];
  const total = script.length; let k = 0;
  for (const [cap, fn, ms] of script) { if (!alive()) return; $("demoTxt").textContent = t("d")[cap] || I18N.en.d[cap]; k++; $("demoProg").style.width = (k / total * 100) + "%"; if (fn) await fn(); await wait(ms || 600); }
  if (alive()) endDemo();
}
function endDemo() { demoId++; S.tap = 0; $("demoBar").hidden = true; $("demoBtn").disabled = false; $("demoProg").style.width = "0";
  const ans = S.answered; S = freshState(); S.answered = ans; fullRender(); toast("dYourTurn", "good", 4000); }
$("demoBtn").onclick = () => { closeSafety(); runDemo(); };
$("demoStop").onclick = endDemo;

readTokens(); resize(); S = freshState(); fullRender(); openSafety();
requestAnimationFrame(frame);
})();
