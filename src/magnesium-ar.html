<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

/* Layout: bench stage (balance / volumetric flask / pipette views) with a step-by-step action dock, working notebook on the right. Same system as the KMnO₄ bench. */
:root{
  --bg:#e7eceb; --surface:#f8faf9; --surface-2:#eef2f1; --ink:#162127; --muted:#56666c; --line:#cbd5d4;
  --accent:#8b1d6f; --accent-soft:#f3dcea; --on-accent:#ffffff; --current:#b7791f;
  --ok:#2c7a4d; --ok-soft:#dcefe3; --warn:#9a520a; --warn-soft:#f8e8d5; --bad:#a3302b; --bad-soft:#f6dedc;
  --wall-top:#dde5e4; --wall-bot:#c5d0cf; --bench:#2a3236; --bench-edge:#1b2124; --glass:rgba(40,60,70,.55);
  --f-display:"Bricolage Grotesque", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", "Noto Sans Sinhala", "Noto Sans Tamil", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
:lang(si) body,:lang(ta) body{line-height:1.65}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top > div:first-child{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
:lang(si) .eyebrow,:lang(ta) .eyebrow{letter-spacing:.02em;font-size:12.5px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
:lang(si) h1,:lang(ta) h1{letter-spacing:0;font-size:clamp(22px,2.6vw,32px);line-height:1.3}
.sub{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.top-actions{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.student{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.next{border-color:var(--current);box-shadow:0 0 0 3px color-mix(in srgb,var(--current) 30%,transparent)}
.btn.sm{min-height:40px;padding:6px 10px}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.hold{touch-action:none;user-select:none;-webkit-user-select:none}
.btn.hold.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:42px;font-size:14px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lang button{min-height:36px}
.lang button[lang="si"]{font-family:"Noto Sans Sinhala",var(--f-body)}
.lang button[lang="ta"]{font-family:"Noto Sans Tamil",var(--f-body)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.modebar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prompt{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.prompt .dot{width:9px;height:9px;border-radius:50%;background:var(--current);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--current) 25%,transparent)}
.prompt p{margin:0;font-weight:500;min-width:0}
.viewport{position:relative;height:clamp(320px,calc(100vh - 470px),560px);background:var(--wall-bot);user-select:none;-webkit-user-select:none}
@media (max-width:980px){.viewport{height:clamp(260px,62vw,520px)}}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
.chips{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:60%}
.chip{font-family:var(--f-mono);font-size:12.5px;background:#0E1A2B;color:#D4C4FF;border:1px solid rgba(212,196,255,.25);padding:3px 10px;border-radius:999px}
.chip.ok{color:#9fe6b8;border-color:#2c7a4d}
.chip.bad{color:#ffb4ab;border-color:#a3302b}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 28px);width:max-content;pointer-events:none;text-align:center;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.toast.good{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.toast.party{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);font-weight:600}
.dock{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.panelbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.panelbox > p{margin:0;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
:lang(si) .label,:lang(ta) .label{letter-spacing:0;font-size:12.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:15px;font-family:var(--f-mono);max-width:100%}
input.ok{border-color:var(--ok);background:var(--ok-soft)}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.slider{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;max-width:420px}
.slider input{flex:1;min-width:0}
input[type=range]{accent-color:var(--accent);min-height:30px}
.beamctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.beamctl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.beamctl div{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:4px;background:var(--surface);min-width:0}
.beamctl span{flex:1;text-align:center;font-family:var(--f-mono);font-size:12.5px;min-width:0}
.note{font-size:13.5px;padding:8px 10px;border-radius:8px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--surface);border:1px solid var(--line)}
.calcline{font-family:var(--f-mono);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:12px 4px;min-height:46px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;line-height:1.3;position:relative}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button.ping::after{content:"";position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--current)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:980px){.pane{max-height:none}}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
:lang(si) h3,:lang(ta) h3{letter-spacing:0;font-size:13px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.box.safety{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.box.safety h3{color:var(--warn)}
.box.safety ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.steps li .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:var(--muted);margin-top:2px}
.steps li.done{color:var(--muted)}
.steps li.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps li.now{background:var(--surface);border-color:var(--current)}
.steps li.now .tick{border-color:var(--current);color:var(--current)}
.log{font-size:13.5px;display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}
.log > div{display:grid;grid-template-columns:58px 1fr;gap:6px}
.log span{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;padding-top:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;background:var(--surface-2);font-weight:600}
:lang(si) th,:lang(ta) th{letter-spacing:0;font-size:12px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);white-space:nowrap;text-align:right}
.cc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.cc .ttl{display:flex;justify-content:flex-end}
.cc .ttl em{font-style:normal;font-weight:500;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cc .ttl em.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cc .flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.cc .st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;min-width:0}
.cc .st small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
:lang(si) .cc .st small,:lang(ta) .cc .st small{letter-spacing:0}
.cc .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding-top:14px;max-width:110px;text-align:center}
.cc .arrow b{font-size:20px;color:var(--ink);line-height:1}
.cc svg{width:90px;height:60px;border-radius:8px;border:1px solid var(--line);background:#ffffff}
.cc .via{font-size:12.5px;color:var(--muted);text-align:center}
.replaycv{width:100%;max-width:100%;aspect-ratio:3/2;border-radius:10px;border:1px solid var(--line);display:block;background:#ffffff}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.q p{margin:0 0 4px;font-weight:600}
.q button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:14px}
.q button:hover:not(:disabled){border-color:var(--accent)}
.q button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.q button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q button:disabled{cursor:default}
.score{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.vpt{border-collapse:collapse;font-size:13px;width:100%}
.vpt td,.vpt th{padding:4px 8px;border-top:1px solid var(--line);text-align:center;font-family:var(--f-mono)}
.vpt tr.hl td{background:var(--accent-soft);color:var(--ink);font-weight:600}
.cstep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.cstep:first-child{border-top:0}
.cstep b{font-family:var(--f-mono);font-weight:500;color:var(--ok)}
.cstep .row input{width:140px}
.errlist{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.mchip{font-family:var(--f-mono);font-size:12.5px;background:#0E1A2B;color:#D4C4FF;border:1px solid rgba(212,196,255,.25);padding:3px 10px;border-radius:999px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <div class="sub">NIE Practical Handbook (2018) · al-exp-06 · Mg + 2HCl → MgCl₂ + H₂</div>
    </div>
    <div class="top-actions">
      <span class="student" id="student" hidden></span>
      <div class="seg lang" role="group" aria-label="Language / භාෂාව / மொழி" id="langSeg">
        <button data-lang="si" lang="si" aria-pressed="false">සිංහල</button>
        <button data-lang="en" lang="en" aria-pressed="true">English</button>

  </header>

  <div class="layout">
    <section class="stage">
      <div class="modebar">
        <span class="mchip" id="mchip" hidden></span>
        <span style="flex:1"></span>
        <button class="btn" id="gogBtn" aria-pressed="false"></button>
      </div>
      <div class="prompt"><span class="dot"></span><p id="prompt" aria-live="polite"></p></div>
      <div class="viewport" id="viewport">
        <canvas id="cv" role="img" tabindex="0"></canvas>
        <div class="chips" id="chips"></div>

        <button role="tab" aria-selected="false" data-tab="colours" data-i18n="tabColours"></button>
        <button role="tab" aria-selected="false" data-tab="quiz" data-i18n="tabQuiz" id="quizTab"></button>
      </div>

        <div><h3 data-i18n="logH"></h3><div class="log" id="log"></div></div>
        <div><h3 data-i18n="resH"></h3><div class="tablewrap"><table><tbody id="tbR"></tbody></table></div></div>
        <div><h3 data-i18n="vpH"></h3><div class="tablewrap" id="vpObs"></div></div>

      <div class="pane" id="pane-quiz" hidden>

        <button class="btn" id="retryBtn" data-i18n="tryAgain" style="align-self:flex-start"></button>

    </aside>
  </div>
</div>

<script>
// ---- NL: natural liquids (Beer–Lambert colour, absorbance mixing, depth shading, mixing plumes) + digital readouts ----
// Shared by every bench. All drawing functions take the canvas context explicitly.
var NL = window.NL || (window.NL = (() => {
  const BG = [251, 251, 248]; // white tile / white card behind the vessel
  const parse = c => { if (Array.isArray(c)) return c.slice(0, 3); if (c[0] === "#") return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const m = String(c).match(/[\d.]+/g) || [255, 255, 255]; return [+m[0], +m[1], +m[2]]; };
