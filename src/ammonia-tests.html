function toLogical(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left - ox) / sc, y: (e.clientY - rc.top - oy) / sc }; }

cv.addEventListener("pointerdown", e => { if (!S.gog) return; const p = toLogical(e); for (const k of DETS) { const d = S.D[k], y = tipY(k); if (Math.abs(p.x - d.x) < 14 && p.y < y + 8 && p.y > y - TOOL_H - 6) { S.drag = k; dragOff = { x: p.x - d.x, y: p.y - y }; cv.setPointerCapture(e.pointerId); return; } } });
cv.addEventListener("pointermove", e => { if (!S.drag) return; const p = toLogical(e), d = S.D[S.drag]; d.x = d.tx = Math.max(20, Math.min(940, p.x - dragOff.x)); d.y = d.ty = Math.max(TOOL_H + 10, Math.min(TRAYY, p.y - dragOff.y)); });

function student(x, y, girl, lh, rh, sc = 1) { // lh/rh = [x,y] hand positions relative to (x,y)

  else g.push(`<path d="M-3 7 L3 7 L4 30 L0 35 L-4 30Z" fill="${NAVY}"/><path d="M-10 6 L-2 13 M10 6 L2 13" stroke="#cfcabd" stroke-width="1.5"/>`);

  g.push(`</g>`); return g.join("");

const avatarSvg = () => `<svg viewBox="-30 -46 60 60" aria-hidden="true">${student(0, 0, true, [-20, 40], [20, 40])}</svg>`;
function renderSafety() { $("sfGrid").innerHTML = t("sf").map(([h, b], i) => `<div class="sfcard">${SF_PHOTOS[i] ? `<img src="${SF_PHOTOS[i]}" alt="${esc(h)}" width="517" height="386">` : sfArt(i)}<div class="tx"><b><span class="num">${i + 1}</span>${esc(h)}</b><span>${esc(b)}</span></div></div>`).join(""); $("demoAv").innerHTML = avatarSvg(); }
function openSafety() { renderSafety(); $("sfModal").hidden = false; setTimeout(() => $("sfOk").focus(), 50); }
function closeSafety() { $("sfModal").hidden = true; }

$("sfOk").onclick = () => { S.gog = true; closeSafety(); render(); };
$("sfDemo").onclick = () => { closeSafety(); runDemo(); };
$("sfModal").addEventListener("keydown", e => { if (e.key === "Escape") closeSafety(); });
