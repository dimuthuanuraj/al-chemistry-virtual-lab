<style>
/* Layout: lab bench viewport on the left, a working notebook (bench / results / colours / questions) on the right. */
:root{
  --bg:#e7eceb; --surface:#f8faf9; --surface-2:#eef2f1; --ink:#162127; --muted:#56666c; --line:#cbd5d4;
  --accent:#8b1d6f; --accent-soft:#f3dcea; --on-accent:#ffffff;
  --ok:#2c7a4d; --ok-soft:#dcefe3; --warn:#9a520a; --warn-soft:#f8e8d5; --bad:#a3302b; --bad-soft:#f6dedc;
  --wall-top:#dde5e4; --wall-bot:#c5d0cf; --bench:#2a3236; --bench-edge:#1b2124; --steel:#5b6a72; --glass:rgba(40,60,70,.42); --scale-ink:#1c2a31;
  --f-display:"Bricolage Grotesque", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", "Noto Sans Sinhala", "Noto Sans Tamil", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --steel:#8a9aa2; --glass:rgba(200,225,235,.45); --scale-ink:#1c2a31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --steel:#8a9aa2; --glass:rgba(200,225,235,.45); --scale-ink:#1c2a31;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
:lang(si) body,:lang(ta) body{line-height:1.65}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top > div:first-child{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
:lang(si) .eyebrow,:lang(ta) .eyebrow{letter-spacing:.02em;font-size:12.5px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
:lang(si) h1,:lang(ta) h1{letter-spacing:0;font-size:clamp(22px,2.6vw,32px);line-height:1.3}
h1 sub,h1 sup{font-size:.55em}
.eqn{font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.eqn b{color:var(--accent);font-weight:500}
.top-actions{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Main grid */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prompt{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.prompt .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.prompt p{margin:0;font-weight:500;min-width:0}
.viewport{position:relative;height:clamp(460px,calc(100vh - 300px),820px);background:var(--wall-bot)}
@media (max-width:1000px){.viewport{height:clamp(440px,72vh,760px)}}
canvas{display:block;width:100%;height:100%}
.chips{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.chip{font-family:var(--f-mono);font-size:12.5px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.pink{border-color:var(--accent);color:var(--accent)}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);width:max-content;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.dock{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
:lang(si) .row .label,:lang(ta) .row .label{letter-spacing:0;font-size:12.5px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:14px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.lang button{padding:7px 12px;font-size:14px}
.lang button[lang="si"]{font-family:"Noto Sans Sinhala",var(--f-body)}
.lang button[lang="ta"]{font-family:"Noto Sans Tamil",var(--f-body)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.spacer{flex:1}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* Side panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:12px 4px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;line-height:1.3}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:1000px){.pane{max-height:none}}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.005em}
:lang(si) h2,:lang(ta) h2{letter-spacing:0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
:lang(si) h3,:lang(ta) h3{letter-spacing:0;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.steps li .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:var(--muted);margin-top:2px}
.steps li.done{color:var(--muted)}
.steps li.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps li.now{background:var(--surface);border-color:var(--accent)}
.steps li.now .tick{border-color:var(--accent);color:var(--accent)}

.reader{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.reader input{flex:1;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.note{font-size:13px;padding:8px 10px;border-radius:8px;margin-top:8px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.log{font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.log > div{display:grid;grid-template-columns:58px 1fr;gap:6px}
.log span{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;padding-top:2px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;background:var(--surface-2);font-weight:600}
:lang(si) th,:lang(ta) th{letter-spacing:0;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.conc{color:var(--ok);font-weight:500}
tr.rough td{color:var(--muted)}
.calc{font-size:14px;display:flex;flex-direction:column;gap:6px}
.calc .line{font-family:var(--f-mono);font-size:13px}
.big{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}

.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{display:flex;gap:10px;align-items:center;min-width:0}
.sw i{width:42px;height:42px;border-radius:50%;flex:none;border:1px solid var(--line);box-shadow:inset 0 -6px 10px rgba(0,0,0,.08)}
.sw div{min-width:0;font-size:13px;line-height:1.35}
.sw b{display:block;font-size:13.5px}
.scrub{display:flex;gap:14px;align-items:center}
.scrub .beaker{width:74px;height:74px;border-radius:50%;flex:none;border:1px solid var(--line);box-shadow:inset 0 -10px 18px rgba(0,0,0,.1)}
input[type=range]{width:100%;accent-color:var(--accent)}

.q{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.q p{margin:0 0 4px;font-weight:600}
.q button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.q button:hover:not(:disabled){border-color:var(--accent)}
.q button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.q button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q button:disabled{cursor:default}
.score{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

      <div class="pane" id="pane-colours" hidden>

</div>

  p0: "புனல் மூலம் அளவியை KMnO₄ கரைசலால் நிரப்பி, பின் புனலை அகற்றுக.",
  p1: "0.1000 mol dm⁻³ Fe²⁺ இன் 25.00 cm³ ஐக் கூம்புக் குடுவைக்குள் குழாயியால் இடுக.",
  p2: "சுமார் 20 cm³ ஐதான H₂SO₄ ஐக் குடுவையில் சேர்க்க. அது இல்லாவிடின் கபில MnO₂ உருவாகும்.",

  p4fast: "ஊதா நிறம் உடனே மறைகிறது. இப்போதைக்கு வேகமாகச் சேர்க்கலாம்.",
  p4slow: "இளஞ்சிவப்பு மெதுவாக மங்குகிறது. துளி துளியாகக் குறைக்க.",

  p5ok: "வெளிர் இளஞ்சிவப்பு நிலையானது. இறுதி வாசிப்பைப் பதிக.",
  p6more: "சுற்று பதியப்பட்டது. இரண்டு பெறுமானங்கள் 0.10 cm³ இற்குள் உடன்படும் வரை மீண்டும் செய்க.",
  p6first: "சுற்று பதியப்பட்டது. குடுவையைக் கழுவி ஒரு துல்லியமான சுற்றைச் செய்க.",
  tBrown: "கபில நிறக் கலங்கல் உருவாகிறது. அமிலம் இல்லாவிடின் MnO₄⁻ ஆனது MnO₂ வரை மட்டுமே தாழ்த்தப்படும்.",

  rTitrateFirst: "இறுதி வாசிப்புக்கு முன் அடைப்பானைத் திறந்து நியமிக்க.",
  rNoPink: "இன்னும் நிலையான இளஞ்சிவப்பு இல்லை. KMnO₄ ஐத் துளி துளியாகச் சேர்க்க.",

  species: [["Fe²⁺(aq)", "வெளிர் பச்சை. ஆரம்பக் கரைசல்."], ["Fe³⁺(aq)", "வெளிர் மஞ்சள். Fe²⁺ ஒட்சியேற்றப்படும்போது அதிகரிக்கிறது."], ["அளவியிலுள்ள MnO₄⁻", "செறிந்த ஊதா. பிறையின் அடிப்பகுதி தெரியாத அளவு கருமையானது."], ["Mn²⁺(aq)", "இந்த ஐதாக்கலில் ஏறத்தாழ நிறமற்றது."], ["முடிவுப்புள்ளி", "ஒரு மிகைத் துளி நிலையான வெளிர் இளஞ்சிவப்பைத் தருகிறது."], ["மிகைச் சேர்க்கை", "சுமார் 1 cm³ மிகையாகச் சேர்த்தால் குடுவை அடர் மஜெந்தா நிறமாகும்."], ["MnO₂(s)", "அமிலம் குறைவாக இருக்கும்போது கபில நிறக் கலங்கல்."]],
  quiz: [

  return best.length >= 2 ? best : [];
}
const runLabel = i => i === 0 ? t("rough") : String(i);
function renderTable() {
  const tb = $("tbody");
  if (!S.runs.length) { tb.innerHTML = `<tr><td colspan="4" style="text-align:center;font-family:var(--f-body)" class="muted">${t("noRuns")}</td></tr>`; renderCalc([]); return; }
  const set = concordantSet(), idx = new Set(set.map(r => r.i));
  tb.innerHTML = S.runs.map((r, i) => `<tr class="${i === 0 ? "rough" : ""}"><td style="font-family:var(--f-body)">${runLabel(i)}${r.acid ? "" : " · " + t("noAcidTag")}</td><td>${r.initial.toFixed(2)}</td><td>${r.final.toFixed(2)}</td><td class="${idx.has(i) ? "conc" : ""}">${r.titre.toFixed(2)}${idx.has(i) ? " ✓" : ""}</td></tr>`).join("");
  renderCalc(set);
}
let calcExpect = 0;
function renderCalc(set) {
  const box = $("calcBody");
  if (!set.length) { box.className = "muted small"; box.textContent = t(S.runs.length ? "calcRepeat" : "calcEmpty"); return; }
  const mean = set.reduce((a, r) => a + r.titre, 0) / set.length;
  calcExpect = (FE_CONC * PIPETTE / 1000 / 5) / (mean / 1000);
  const keepVal = $("cIn") ? $("cIn").value : "", workOpen = $("work") && !$("work").hidden;
  box.className = "";
  box.innerHTML = `
    <div>${t("meanTitre")}</div><div class="big">${mean.toFixed(2)} cm³</div>
    <div class="small muted">${t("fromRuns", { runs: set.map(r => runLabel(r.i)).join(", ") })}</div>
    <label class="small" for="cIn" style="margin-top:6px">${t("yourConc")}</label>
    <div class="reader"><input id="cIn" type="number" step="0.0001" placeholder="0.0___"><button class="btn primary" id="cBtn">${t("check")}</button></div>
    <div id="cNote"></div>
    <button class="btn" id="workBtn" style="align-self:flex-start;margin-top:4px">${t("showWork")}</button>
    <div id="work" ${workOpen ? "" : "hidden"} class="calc">
      <div class="line">n(Fe²⁺) = 0.1000 × 25.00/1000 = 2.500 × 10⁻³ mol</div>
      <div class="line">n(MnO₄⁻) = n(Fe²⁺) ÷ 5 = 5.000 × 10⁻⁴ mol</div>
      <div class="line">c(KMnO₄) = 5.000 × 10⁻⁴ ÷ (${mean.toFixed(2)}/1000)</div>
      <div class="line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= ${calcExpect.toFixed(5)} mol dm⁻³</div>
      <div class="small muted">${t("workNote", { c: S.cKM.toFixed(4) })}</div>
    </div>`;
  $("cIn").value = keepVal;
  renderCalcNote();
  $("cBtn").onclick = () => {
    const v = parseFloat($("cIn").value), e = calcExpect;
    if (!isFinite(v)) S.calcNote = ["warn", "cEnter"];
    else if (Math.abs(v - e) / e <= 0.006) S.calcNote = ["ok", "cOk", { v: e.toFixed(4) }];
    else if (Math.abs(v - e * 5) / (e * 5) < 0.01) S.calcNote = ["bad", "cX5"];
    else if (Math.abs(v - e / 5) / (e / 5) < 0.01) S.calcNote = ["bad", "cD5"];
    else S.calcNote = ["bad", "cBad"];
    renderCalcNote();
  };
  $("workBtn").onclick = () => { $("work").hidden = !$("work").hidden; };
}
function renderCalcNote() { const n = $("cNote"); if (!n) return; n.innerHTML = ""; if (!S.calcNote) return; const [cls, k, p] = S.calcNote; const d = document.createElement("div"); d.className = "note " + cls; d.textContent = t(k, p); n.append(d); }

// colour atlas
const SPECIES_C = [[{ fe2: 0.06 }], [{ fe3: 0.035 }], [{ mno4: 0.02 }, 1.8], [{}], [{ mno4: 1.4e-5, fe3: 0.035 }], [{ mno4: 2.8e-4, fe3: 0.035 }], [{ mno2: 6e-4, fe3: 0.02 }]];
function renderSwatches() {
  const names = t("species");
  $("swatches").innerHTML = SPECIES_C.map(([c, L], i) => `<div class="sw"><i style="background:${css(solRGB({ mno4: 0, fe2: 0, fe3: 0, mno2: 0, ...c }, L || 4))}"></i><div><b>${names[i][0]}</b><span class="muted">${names[i][1]}</span></div></div>`).join("")
    + `<div class="sw"><i id="liveSw"></i><div><b>${t("yourFlask")}</b><span class="muted" id="liveTxt"></span></div></div>`;
  liveSwatch(); scrub();
}
function liveSwatch() {
  const el = $("liveSw"); if (!el) return;
  if (S.flask.V > 0) { el.style.background = css(solRGB(conc(S.flask))); $("liveTxt").textContent = t("inFlask", { v: S.flask.V.toFixed(1) }); }
  else { el.style.background = "transparent"; $("liveTxt").textContent = t("empty"); }
}
function scrub() {
  const x = +$("scrub").value / 100, noAcid = $("scrubNoAcid").checked;
  const V = 45 + 25 * x, nFe = 0.0025, nMn = 0.0005 * x, L = V / 1000;
  let c;
  if (!noAcid) { const used = Math.min(nMn, nFe / 5); c = { fe2: (nFe - 5 * used) / L, fe3: 5 * used / L, mno4: (nMn - used) / L, mno2: 0 }; }
  else { const used = Math.min(nMn, nFe / 3); c = { fe2: (nFe - 3 * used) / L, fe3: 3 * used / L, mno4: (nMn - used) / L, mno2: used / L }; }
  $("scrubSwatch").style.background = css(solRGB(c));
  const pct = Math.round(x * 100);
  $("scrubLabel").textContent = noAcid ? t("scrubNoAcidTxt", { p: pct }) : pct < 100 ? t("scrubBefore", { p: pct }) : pct <= 101 ? t("scrubEq") : t("scrubAfter", { p: pct });
}

// quiz
function renderQuiz() {
  const Q = t("quiz");
  $("quiz").innerHTML = Q.map((q, i) => `<div class="q" id="q${i}"><p>${i + 1}. ${q.q}</p>${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${o}</button>`).join("")}<div class="exp"></div></div>`).join("");
  Object.entries(S.answered).forEach(([i, j]) => markAnswer(+i, j));
  score();
}
function markAnswer(i, j) {
  const ok = j === QUIZ_ANS[i];
  $("q" + i).querySelectorAll("button").forEach((x, k) => { x.disabled = true; if (k === QUIZ_ANS[i]) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
  const d = document.createElement("div"); d.className = "note " + (ok ? "ok" : "bad"); d.textContent = t(ok ? "correct" : "notQuite") + t("quiz")[i].e;
  const ex = $("q" + i).querySelector(".exp"); ex.innerHTML = ""; ex.append(d);
}
$("quiz").onclick = e => {
  const b = e.target.closest("button[data-q]"); if (!b) return;
  const i = +b.dataset.q, j = +b.dataset.o; if (i in S.answered) return; S.answered[i] = j; markAnswer(i, j); score();
};
function score() {
  const n = Object.keys(S.answered).length, s = Object.entries(S.answered).filter(([i, j]) => j === QUIZ_ANS[+i]).length;
  $("score").textContent = `${s} / ${QUIZ_ANS.length}${n < QUIZ_ANS.length ? " · " + t("scoreLeft", { n: QUIZ_ANS.length - n }) : ""}`;
}

// language
function applyLang(lang) {
  LANG = lang; try { localStorage.setItem("kmno4-lang", lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  if (!S) return;
  render(); renderLog(); renderNote(); renderTable(); renderSwatches(); renderQuiz();
}
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));

// tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["bench", "results", "colours", "quiz"].forEach(id => $("pane-" + id).hidden = id !== b.dataset.tab);
});

// wiring
$("fillBtn").onclick = fillBurette; $("feBtn").onclick = pipetteFe; $("acidBtn").onclick = addAcid; $("nextBtn").onclick = nextRun;
$("dropBtn").onclick = addDrop; $("recordBtn").onclick = recordReading; $("resetBtn").onclick = reset;
$("readingIn").addEventListener("keydown", e => { if (e.key === "Enter") recordReading(); });
document.querySelectorAll("#tapSeg button").forEach(b => b.onclick = () => setFlow(+b.dataset.flow));
$("swirl").onchange = e => { S.swirl = e.target.checked; };
$("digital").onchange = e => { S.digital = e.target.checked; renderLive(); };
$("scrub").oninput = scrub; $("scrubNoAcid").onchange = scrub;
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  if (/^[0-3]$/.test(e.key)) setFlow(+e.key);
  else if (e.key === "d" || e.key === "D") addDrop();
  else if (e.key === "s" || e.key === "S") { $("swirl").checked = !$("swirl").checked; S.swirl = $("swirl").checked; }
});

applyLang(LANG);
readTokens(); resize(); reset(); renderSwatches();
if (document.fonts) document.fonts.ready.then(() => {}).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
