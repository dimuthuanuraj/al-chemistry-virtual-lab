<title>Cathode Ray Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<style>
/* Layout: physics bench (circuit + Crookes tube) on the left, a working notebook (guide / observations / colours / questions) on the right. Same system as the KMnO₄ bench. */
:root{
  --bg:#e7eceb; --surface:#f8faf9; --surface-2:#eef2f1; --ink:#162127; --muted:#56666c; --line:#cbd5d4;
  --accent:#8b1d6f; --accent-soft:#f3dcea; --on-accent:#ffffff; --current:#b7791f;
  --ok:#2c7a4d; --ok-soft:#dcefe3; --warn:#9a520a; --warn-soft:#f8e8d5; --bad:#a3302b; --bad-soft:#f6dedc;
  --wall-top:#dde5e4; --wall-bot:#c5d0cf; --bench:#2a3236; --bench-edge:#1b2124; --glass:rgba(40,60,70,.5);
  --f-display:"Bricolage Grotesque", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Noto Sans Sinhala", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", "Noto Sans Sinhala", "Noto Sans Tamil", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;
  --accent:#e070c2; --accent-soft:#3b1f33; --on-accent:#1a0b16; --current:#e6b35c;
  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
:lang(si) body,:lang(ta) body{line-height:1.65}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top > div:first-child{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
:lang(si) .eyebrow,:lang(ta) .eyebrow{letter-spacing:.02em;font-size:12.5px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
:lang(si) h1,:lang(ta) h1{letter-spacing:0;font-size:clamp(22px,2.6vw,32px);line-height:1.3}
.sub{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.top-actions{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.student{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.next{border-color:var(--current);box-shadow:0 0 0 3px color-mix(in srgb,var(--current) 30%,transparent)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.danger[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prompt{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.prompt .dot{width:9px;height:9px;border-radius:50%;background:var(--current);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--current) 25%,transparent)}
.prompt p{margin:0;font-weight:500;min-width:0}
.viewport{position:relative;height:clamp(340px,calc(100vh - 420px),620px);background:var(--wall-bot);user-select:none;-webkit-user-select:none}
@media (max-width:980px){.viewport{height:clamp(260px,62vw,560px)}}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
.chips{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:60%}
.chip{font-family:var(--f-mono);font-size:12px;background:#0E1A2B;color:#D4C4FF;border:1px solid rgba(212,196,255,.25);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.hv{background:#5a3a00;color:#ffe08a;border-color:#ffc857}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 28px);width:max-content;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.toast.danger{background:#b3261e;color:#ffffff;font-weight:600}
.toast.party{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);font-weight:600}
.dock{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
:lang(si) .label,:lang(ta) .label{letter-spacing:0;font-size:12.5px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:42px;font-size:14px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lang button{min-height:36px}
.lang button[lang="si"]{font-family:"Noto Sans Sinhala",var(--f-body)}
.lang button[lang="ta"]{font-family:"Noto Sans Tamil",var(--f-body)}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:14px;max-width:100%}
.slider{display:flex;align-items:center;gap:8px;min-width:200px;flex:1 1 200px;max-width:340px}
.slider input{flex:1;min-width:0}
.slider output{font-family:var(--f-mono);font-size:13px;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);min-height:30px}
.status{font-size:13.5px;padding:8px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.status.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.status.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status.hv{background:#fff4d6;border-color:#c98a00;color:#6b4700}
.kbd{font-size:12px;color:var(--muted)}
.modebox{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:12px 4px;min-height:46px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;line-height:1.3;position:relative}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button.ping::after{content:"";position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--current)}
.pane{padding:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:980px){.pane{max-height:none}}
h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
:lang(si) h3,:lang(ta) h3{letter-spacing:0;font-size:13px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.box.safety{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.box.safety h3{color:var(--warn)}
.box.safety ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.steps li .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:var(--muted);margin-top:2px}
.steps li.done{color:var(--muted)}
.steps li.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps li.now{background:var(--surface);border-color:var(--current)}
.steps li.now .tick{border-color:var(--current);color:var(--current)}
.log{font-size:13.5px;display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}
.log > div{display:grid;grid-template-columns:58px 1fr;gap:6px}
.log span{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;padding-top:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--surface-2);font-weight:600;vertical-align:bottom}
:lang(si) th,:lang(ta) th{letter-spacing:0;font-size:12px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.cc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.cc .ttl{display:flex;justify-content:flex-end}
.cc .ttl em{font-style:normal;font-weight:500;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cc .ttl em.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cc .flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.cc .st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;min-width:0}
.cc .st small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
:lang(si) .cc .st small,:lang(ta) .cc .st small{letter-spacing:0}
.cc .sw{width:84px;height:54px;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:block}
.cc .arrow{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding-top:14px;max-width:110px;text-align:center}
.cc .arrow b{font-size:20px;color:var(--ink);line-height:1}
.cc .via{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.cc .via i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.replaycv{width:100%;max-width:100%;aspect-ratio:330/200;border-radius:10px;border:1px solid var(--line);background:#0b1014;display:block}
.rname{font-size:14px;font-weight:600}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.q p{margin:0 0 4px;font-weight:600}
.q button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:14px}
.q button:hover:not(:disabled){border-color:var(--accent)}
.q button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.q button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q button:disabled{cursor:default}
.note{font-size:13px;padding:8px 10px;border-radius:8px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <div class="sub">NIE Practical Handbook (2018) · al-exp-01</div>
    </div>
    <div class="top-actions">
      <span class="student" id="student" hidden></span>
      <div class="seg lang" role="group" aria-label="Language / භාෂාව / மொழி" id="langSeg">
        <button data-lang="si" lang="si" aria-pressed="false">සිංහල</button>
        <button data-lang="en" lang="en" aria-pressed="true">English</button>
        <button data-lang="ta" lang="ta" aria-pressed="false">தமிழ்</button>
      </div>
      <button class="btn" id="resetBtn" data-i18n="reset"></button>
    </div>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="prompt"><span class="dot"></span><p id="prompt" aria-live="polite"></p></div>
      <div class="viewport" id="viewport">
        <canvas id="cv" role="img" tabindex="0" data-i18n-aria="canvasAria"></canvas>
        <div class="chips" id="chips"></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
      <div class="dock">
        <div class="status" id="status" aria-live="polite"></div>
        <div class="row">
          <span class="label" data-i18n="circuitL"></span>
          <button class="btn" id="undoBtn" data-i18n="undo"></button>
          <button class="btn" id="clearBtn" data-i18n="clear"></button>
          <button class="btn" id="hintBtn" data-i18n="hint"></button>
          <button class="btn primary" id="swBtn"></button>
          <button class="btn" id="revBtn" data-i18n="reverse"></button>
        </div>
        <div class="row">
          <label class="label" for="screw" data-i18n="screwL"></label>
          <div class="slider"><input type="range" id="screw" min="0" max="100" value="15"><output id="screwOut">15</output></div>
          <button class="btn" id="dimBtn" aria-pressed="false" data-i18n="dim"></button>
        </div>
        <div class="row">
          <span class="label" data-i18n="tubeL"></span>
          <div class="seg" role="group" id="modeSeg" data-i18n-aria="tubeL">
            <button data-m="maltese" aria-pressed="true" data-i18n="mMaltese"></button>
            <button data-m="paddle" aria-pressed="false" data-i18n="mPaddle"></button>
            <button data-m="slit" aria-pressed="false" data-i18n="mSlit"></button>
          </div>
        </div>
        <div class="modebox" id="paddleBox" hidden>
          <button class="btn" id="wheelBtn" data-i18n="resetWheel"></button>
        </div>
        <div class="modebox" id="slitBox" hidden>
          <button class="btn" id="magBtn" aria-pressed="false"></button>
          <button class="btn" id="flipBtn" data-i18n="flip"></button>
          <label class="label" for="strength" data-i18n="strength"></label>
          <div class="slider"><input type="range" id="strength" min="0" max="100" value="60"><output id="strOut">60%</output></div>
          <button class="btn" id="plBtn" aria-pressed="false"></button>
          <label class="label" for="plV" data-i18n="voltage"></label>
          <div class="slider"><input type="range" id="plV" min="0" max="3" step="0.1" value="1.5"><output id="plOut">1.5 kV</output></div>
          <select id="plPol" data-i18n-aria="platesL"><option value="top" data-i18n="polTop"></option><option value="bottom" data-i18n="polBottom"></option></select>
        </div>
        <p class="kbd" data-i18n="keys"></p>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="guide" data-i18n="tabGuide"></button>
        <button role="tab" aria-selected="false" data-tab="obs" data-i18n="tabObs"></button>
        <button role="tab" aria-selected="false" data-tab="colours" data-i18n="tabColours"></button>
        <button role="tab" aria-selected="false" data-tab="quiz" data-i18n="tabQuiz" id="quizTab"></button>
      </div>
      <div class="pane" id="pane-guide">
        <div class="headrow">
          <div><h3 data-i18n="aimH"></h3><p class="small" data-i18n="aim"></p></div>
          <div class="ring" aria-hidden="true"><svg width="46" height="46"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ringArc" cx="23" cy="23" r="18" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><span id="ringTxt">0/6</span></div>
        </div>
        <div><h3 data-i18n="appH"></h3><div class="chiplist" id="appList"></div></div>
        <div><h3 data-i18n="procH"></h3><ul class="steps" id="steps"></ul></div>
        <div class="box safety"><h3 data-i18n="safeH"></h3><ul id="safeList"></ul></div>
      </div>
      <div class="pane" id="pane-obs" hidden>
        <div><h3 data-i18n="logH"></h3><div class="log" id="log"></div></div>
        <div><h3 data-i18n="resH"></h3>
          <div class="tablewrap"><table>
            <thead><tr><th data-i18n="thProp"></th><th data-i18n="thObs"></th><th data-i18n="thInf"></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table></div>
        </div>
      </div>
      <div class="pane" id="pane-colours" hidden>
        <div><h2 data-i18n="coloursH"></h2><p class="small muted" style="margin-top:4px" data-i18n="coloursIntro"></p></div>
        <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="box" style="display:flex;flex-direction:column;gap:8px">
          <h3 data-i18n="replayH" style="margin:0"></h3>
          <select id="replaySel" data-i18n-aria="replaySelAria"></select>
          <canvas id="mini" class="replaycv" width="660" height="400" aria-hidden="true"></canvas>
          <input type="range" id="replay" min="0" max="1000" value="0" data-i18n-aria="replayH">
          <div class="row"><button class="btn" id="playBtn"></button><span class="rname" id="rname"></span></div>
          <div class="small muted" id="rhint"></div>
        </div>
      </div>
      <div class="pane" id="pane-quiz" hidden>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
          <h2 data-i18n="quizH"></h2><span class="score" id="score"></span>
        </div>
        <div id="quiz" style="display:flex;flex-direction:column;gap:12px"></div>
        <button class="btn" id="retryBtn" data-i18n="tryAgain" style="align-self:flex-start"></button>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {

  canvasAria: "சுற்று மேசை: 6 V வழங்கல், ஆளி, தூண்டற் சுருள், தாங்கியில் குரூக்ஸ் குழாய். சுற்றை இணைக்க முடிவிடங்களுக்கிடையே இழுக்கவும்.",
  p0: "கம்பிகளை இழுக்க: வழங்கல் + → ஆளி → சுருளின் முதற் சுற்று → வழங்கல் −. பின் துணைச் சுருள் − → கதோட்டு (K), + → அனோட்டு (A).",
  p0rev: "முனைவைச் சரிபார்க்க: கதோட்டு (K) சுருளின் − முடிவிடத்துடன் இணைக்கப்பட வேண்டும்.",
  p1: "ஆளியை மூடி, சுருளின் இடைவெளியில் பொறிகள் பாயும் வரை இடைமறிப்பித் திருகைச் சுழற்றுக.", p1b: "இடைமறிப்பி ஒலித்துப் பொறிகள் பாயும் வரை திருகை மெதுவாகச் சுழற்றுக.",
  p2: "மோல்ற்றீசுச் சிலுவைக் குழாயுடன் குழாயின் முனையைப் பாருங்கள். அறை ஒளியைக் குறைப்பது உதவும்.",
  p3: "ஆளியைத் திறந்து துடுப்புச் சில்லுக் குழாய்க்கு மாற்றி, மீண்டும் ஆளியை மூடிச் சில்லை அவதானிக்க.",
  p4: "ஆளியைத் திறந்து பிளவுக் குழாய்க்கு மாற்றுக. ஆளியை மூடி, காந்தத்தை அருகே கொண்டுவந்து, பின் ஏற்றிய தட்டுகளை இயக்குக.",
  p4b: "இப்போது திரும்பல் தட்டுகளை இயக்கி, கற்றை எந்தத் தட்டு நோக்கி வளைகிறது எனப் பாருங்கள்.", p4c: "இப்போது காந்தத்தைக் குழாயருகே கொண்டுவந்து கற்றைக்கு அண்மையாக இழுக்கவும்.",
  p5: "ஆளியைத் திறந்து குழாய்க் கம்பிகளின் முனைவை மாற்றி, மீண்டும் ஆளியை மூடுக.", pDone: "எல்லாப் படிகளும் முடிந்தன. வினாக்கள் தாவலை முயல்க.",
  lWired: "சுற்று இணைக்கப்பட்டது: 6 V வழங்கல் → ஆளி → தூண்டற் சுருள் (முதற் சுற்று). துணைச் சுற்று: − கதோட்டுக்கு, + அனோட்டுக்கு.",
  lSpark: "இடைமறிப்பி ஒலிக்கிறது; தூண்டற் சுருளின் இடைவெளியில் பொறிகள் பாய்கின்றன.",
  lGlow: "ஆளியை மூடியதும் இருண்ட குழாயில் கதோட்டுக்கு எதிரேயுள்ள கண்ணாடியில் பச்சைப் புளோரொளிர் ஒளிர்வு தோன்றுகிறது.",
  lShadow: "மோல்ற்றீசுச் சிலுவைக் குழாய்: பச்சையாக ஒளிரும் முனையில் சிலுவையின் கூர்மையான நிழல் தோன்றுகிறது. கதோட்டுக் கதிர்கள் நேர்கோட்டில் செல்கின்றன.",
  lWheel: "துடுப்புச் சில்லுக் குழாய்: சில்லு கதோட்டிலிருந்து அனோட்டு நோக்கி உருள்கிறது. கதோட்டுக் கதிர்களுக்கு உந்தம் உண்டு, எனவே திணிவு உண்டு.",
  lMagnet: "பிளவுக் குழாய்: காந்தத்தை அருகே கொண்டுவரும்போது நேரான பச்சைக் கற்றை வளைகிறது.",

  const ca = TERM[a].c, cb = TERM[b].c;
  if (ca === cb) return toast("tSameComp", "warn");
  if (has(a, b)) return toast("tDup", "warn");
  const tube = ca === "tube" || cb === "tube", sec = ca === "cs" || cb === "cs";
  if (tube && !sec) return toast("tLowV", "warn", 4500);
  if (sec && !tube) return toast("tMixHV", "warn", 4500);
  S.wires.push({ a, b }); render();
  const A = analyze(); if (A.secondary === "rev" && !S.ev.wired) toast("tWrongPol", "warn", 4500);
}
function removeWire(i) { if (S.sw) return toast("tWireOn", "danger"); S.wires.splice(i, 1); render(); }
function toggleSwitch() {
  if (!S.sw) { const A0 = analyze(); if (A0.shortAny) return toast("tShort", "danger", 4500); S.sw = true; const A = analyze(); if (A.secondary === "rev" && !S.ev.deflect) toast("tWrongPol", "warn", 4500); }
  else S.sw = false;
  render();
}
function reversePol() {
  if (S.sw) return toast("tRevOn", "danger");
  const A = analyze(); if (A.secondary === "none") return toast("tConnectTube", "warn");
  S.wires.forEach(w => { [["a"], ["b"]].forEach(([k]) => { if (w[k] === "K") w[k] = "A"; else if (w[k] === "A") w[k] = "K"; }); });
  log("lSwap"); render();
}
function setMode(m) { if (m === S.mode) return; if (analyze().hv) return toast("tChangeOn", "danger"); S.mode = m; S.parts = []; S.glow = 0; S.rev = 0; S.maltT = 0; render(); }
function showHint() { const A = analyze(); let pair = null;
  if (!A.primaryOK) pair = CANON.slice(0, 3).find(([a, b]) => !has(a, b)) || CANON[0];
  else if (A.secondary !== "ok") pair = A.secondary === "rev" ? ["sn", "K"] : CANON.slice(3).find(([a, b]) => !has(a, b));
  if (pair) { S.hintPair = pair; S.hintUntil = time + 4; } }

// =====================================================================
// UI
// =====================================================================
let toastT;
function toast(k, kind = "", ms = 3600, p) { const el = $("toast"); el.textContent = t(k, p); el.className = "toast show " + kind; clearTimeout(toastT); toastT = setTimeout(() => el.className = "toast " + kind, ms); }
function log(k) { S.logs.unshift({ time: new Date().toTimeString().slice(0, 8), k }); renderLog(); }
function renderLog() { const box = $("log"); box.innerHTML = ""; S.logs.forEach(e => { const d = document.createElement("div"), s = document.createElement("span"), m = document.createElement("div"); s.textContent = e.time; m.textContent = t(e.k); d.append(s, m); box.append(d); }); }
function addResult(id) { if (!S.results.includes(id)) S.results.push(id); renderTable(); }
function renderTable() {
  const tb = $("tbody");
  if (!S.results.length) { tb.innerHTML = ""; const tr = document.createElement("tr"), td = document.createElement("td"); td.colSpan = 3; td.className = "muted"; td.textContent = t("noRes"); tr.append(td); tb.append(tr); return; }
  tb.innerHTML = S.results.map(id => `<tr>${t(id).map(x => `<td>${x}</td>`).join("")}</tr>`).join("");
}
function phase() { const d = stepsDone(); const i = d.indexOf(false); return i < 0 ? 6 : i; }
function promptText(p, A) {
  if (p === 0 && A.secondary === "rev") return t("p0rev");
  if (p === 1 && S.sw && A.primaryOK && !A.band) return t("p1b");
  if (p === 4 && S.mode === "slit") { if (S.ev.mag && !S.ev.pl) return t("p4b"); if (S.ev.pl && !S.ev.mag) return t("p4c"); }
  return t(["p0", "p1", "p2", "p3", "p4", "p5", "pDone"][p]);
}
function render() {
  const A = analyze(), p = phase(), done = stepsDone();
  $("prompt").textContent = promptText(p, A);
  $("steps").innerHTML = t("steps").map((s, i) => `<li class="${done[i] ? "done" : i === p ? "now" : ""}"><span class="tick">${done[i] ? "✓" : i + 1}</span><span>${s}</span></li>`).join("");
  const n = done.filter(Boolean).length; $("ringTxt").textContent = `${n}/6`; $("ringArc").style.strokeDashoffset = String(113.1 * (1 - n / 6));
  $("swBtn").textContent = t(S.sw ? "swOpen" : "swClose");
  $("dimBtn").setAttribute("aria-pressed", String(S.dim));
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === S.mode)));
  $("paddleBox").hidden = S.mode !== "paddle"; $("slitBox").hidden = S.mode !== "slit";
  $("magBtn").textContent = t(S.magnet.on ? "magOff" : "magOn"); $("magBtn").setAttribute("aria-pressed", String(S.magnet.on)); $("flipBtn").disabled = !S.magnet.on;
  $("plBtn").textContent = t(S.plates.on ? "platesOn" : "platesOff"); $("plBtn").setAttribute("aria-pressed", String(S.plates.on));
  $("plPol").value = S.plates.top ? "top" : "bottom";
  ["swBtn", "revBtn", "hintBtn"].forEach(id => $(id).classList.remove("next"));
  if (p === 1 && !S.sw) $("swBtn").classList.add("next"); if (p === 5) $("revBtn").classList.add("next"); if (p === 0) $("hintBtn").classList.add("next");
  renderLive(A);
}
function renderLive(A) {
  A = A || analyze();
  const chips = [`<span class="chip">${t("chipSupply")}</span>`];
  if (A.hv) chips.push(`<span class="chip hv">⚡ ${t("chipCoil")}</span>`);
  chips.push(`<span class="chip">${t("chipTube", { m: t({ maltese: "mMaltese", paddle: "mPaddle", slit: "mSlit" }[S.mode]) })}</span>`);
  if (S.mode === "slit" && S.plates.on) chips.push(`<span class="chip">${t("chipPlates", { v: S.plates.V.toFixed(1) })}</span>`);
  if (S.mode === "slit" && S.magnet.on) chips.push(`<span class="chip">${t("chipField", { p: Math.round(S.strength * 100) })}</span>`);
  const h = chips.join(""); if ($("chips").innerHTML !== h) $("chips").innerHTML = h;
  let cls = "status", msg;
  if (A.shortAny) { cls += " warn"; msg = t("stShort"); }
  else if (!S.wires.length) msg = t("stNone");
  else if (!A.primaryOK) { cls += " warn"; msg = t("stPrimary"); }
  else if (A.secondary === "none") { cls += " warn"; msg = t("stSecondary"); }
  else { msg = A.secondary === "rev" ? t("stRev") : t("stOk"); cls += A.secondary === "rev" ? " warn" : " ok";
    if (!S.sw) msg += " " + t("stOpen"); else if (!A.band) msg += " " + t("stNoBuzz"); else { msg = "⚡ " + t("stHV") + " · " + t("stSpark") + (A.secondary === "rev" ? " · " + t("stRev") : ""); cls = "status hv"; } }
  if ($("status").textContent !== msg) $("status").textContent = msg; if ($("status").className !== cls) $("status").className = cls;
  const pt = promptText(phase(), A); if ($("prompt").textContent !== pt) render();
}

// colour cards
function svgBeam(curved, glow) {
  const path = curved ? "M6 27 L30 27 Q52 27 78 8" : "M6 27 L78 27";
  return `<svg class="sw" viewBox="0 0 84 54" role="img" aria-hidden="true"><rect width="84" height="54" fill="#0b1014"/><rect x="40" y="4" width="26" height="3" fill="#c0392b"/><text x="53" y="16" fill="#ff8a7a" font-size="9" text-anchor="middle" font-family="sans-serif">+</text><rect x="40" y="47" width="26" height="3" fill="#1d4e89"/>${glow ? `<path d="${path}" stroke="rgba(91,227,122,.35)" stroke-width="7" fill="none" stroke-linecap="round"/><path d="${path}" stroke="#c8ffd2" stroke-width="2" fill="none" stroke-linecap="round"/>` : ""}</svg>`;
}
const CARDS = [
  { id: "c1", b: ["c1b", `<span class="sw" style="background:#15191d"></span>`], r: "c1r", a: ["c1a", `<span class="sw" style="background:${GLOW_HEX}"></span>`], via: ["c1v", "#2f6b3a"] },
  { id: "c2", b: ["c2b", svgBeam(false, true)], r: "c2r", a: ["c2a", svgBeam(true, true)], via: ["c2v", "#7fd197"] },
];
function renderCards() {
  $("cards").innerHTML = CARDS.map(c => { const rec = S.seg[c.id].end !== null;
    return `<div class="cc"><div class="ttl"><em class="${rec ? "ok" : ""}">${rec ? "✓ " + t("seen") : t("notYet")}</em></div>
      <div class="flow"><div class="st"><small>${t("before")}</small>${c.b[1]}<span>${t(c.b[0])}</span></div>
      <div class="arrow"><b>→</b><span>${t(c.r)}</span></div>
      <div class="st"><small>${t("after")}</small>${c.a[1]}<span>${t(c.a[0])}</span></div></div>
      <div class="via"><i style="background:${c.via[1]}"></i>${t("via", { c: t(c.via[0]) })}</div></div>`; }).join("");
}
const mini = $("mini"), mctx = mini.getContext("2d");
let playing = false, playRAF = 0;
function renderReplaySel() { const v = $("replaySel").value || "c1"; $("replaySel").innerHTML = CARDS.map(c => `<option value="${c.id}">${t(c.b[0])} → ${t(c.a[0])}</option>`).join(""); $("replaySel").value = v; }
function renderReplay() {
  const id = $("replaySel").value || "c1", sg = S.seg[id], ok = sg.start !== null && sg.end !== null && sg.end > sg.start;
  $("replay").disabled = !ok; $("playBtn").disabled = !ok; $("playBtn").textContent = t(playing ? "pause" : "play");
  $("rhint").textContent = ok ? t("replayHint") : t("replayNone");
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.fillStyle = "#0b1014"; mctx.fillRect(0, 0, mini.width, mini.height);
  const s = 1.85; mctx.setTransform(s, 0, 0, s, -598 * s, -100 * s);
  let snap;
  if (!ok) { snap = { mode: id === "c1" ? "maltese" : "slit", glow: 0, rev: 0, pts: null, wheelX: 680, wheelRot: 0, pl: null }; $("rname").textContent = ""; }
  else { const idx = Math.round(sg.start + (+$("replay").value / 1000) * (sg.end - sg.start)); snap = S.hist[Math.max(0, Math.min(S.hist.length - 1, idx))];
    $("rname").textContent = id === "c1" ? t("rGlow", { p: Math.round(snap.glow * 100) }) : t("rBeam", { d: (Math.abs(snap.d) * 0.5).toFixed(1) }); }
  drawTubeBody(mctx, snap); drawTubeLight(mctx, snap, false);
}
function togglePlay() {
  playing = !playing; cancelAnimationFrame(playRAF); renderReplay(); if (!playing) return;
  if (+$("replay").value >= 1000) $("replay").value = 0;
  const sg = S.seg[$("replaySel").value]; const dur = Math.max(3, (sg.end - sg.start) * 0.08 * 2); let lt = performance.now();
  const tick = now => { const dt = (now - lt) / 1000; lt = now; const v = Math.min(1000, +$("replay").value + dt / dur * 1000); $("replay").value = v; renderReplay(); if (v < 1000 && playing) playRAF = requestAnimationFrame(tick); else { playing = false; renderReplay(); } };
  playRAF = requestAnimationFrame(tick);
}

// quiz + scores
function readScores() { try { return JSON.parse(localStorage.getItem("svl-scores") || "{}") || {}; } catch (e) { return {}; } }
function saveScore(pct) { try { const s = readScores(); if (!(s[SIM_ID] >= pct)) { s[SIM_ID] = pct; localStorage.setItem("svl-scores", JSON.stringify(s)); } } catch (e) {} }
function renderQuiz() {
  const Q = t("quiz"), L = ["A", "B", "C", "D"];
  $("quiz").innerHTML = Q.map((q, i) => `<div class="q" id="q${i}"><p>${i + 1}. ${q.q}</p>${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${L[j]}) ${o}</button>`).join("")}<div class="exp"></div></div>`).join("");
  Object.entries(S.answered).forEach(([i, j]) => markAnswer(+i, j)); score();
}
function markAnswer(i, j) {
  const ok = j === QUIZ_ANS[i];
  $("q" + i).querySelectorAll("button").forEach((x, k) => { x.disabled = true; if (k === QUIZ_ANS[i]) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
  const d = document.createElement("div"); d.className = "note " + (ok ? "ok" : "bad"); d.textContent = t(ok ? "correct" : "notQuite") + t("quiz")[i].e;
  const ex = $("q" + i).querySelector(".exp"); ex.innerHTML = ""; ex.append(d);
}
$("quiz").onclick = e => { const b = e.target.closest("button[data-q]"); if (!b) return; const i = +b.dataset.q, j = +b.dataset.o; if (i in S.answered) return; S.answered[i] = j; markAnswer(i, j); score(); };
function score() {
  const n = Object.keys(S.answered).length, s = Object.entries(S.answered).filter(([i, j]) => j === QUIZ_ANS[+i]).length, N = QUIZ_ANS.length;
  if (n === N) saveScore(Math.round(s / N * 100));
  const best = readScores()[SIM_ID];
  $("score").textContent = `${s} / ${N}` + (n < N ? " · " + t("scoreLeft", { n: N - n }) : "") + (best !== undefined ? " · " + t("best", { p: best }) : "");
}
$("retryBtn").onclick = () => { S.answered = {}; renderQuiz(); };

function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $("appList").innerHTML = t("app").map(a => `<span>${a}</span>`).join("");
  $("safeList").innerHTML = t("safe").map(a => `<li>${a}</li>`).join("");
  try { const st = JSON.parse(localStorage.getItem("svl-student") || "null"); if (st && st.name) { $("student").hidden = false; $("student").textContent = t("student", { name: st.name, cls: st.cls ? " · " + st.cls : "" }); } } catch (e) {}
}
function renderAll() { applyStatic(); render(); renderLog(); renderTable(); renderCards(); renderReplaySel(); renderReplay(); renderQuiz(); }
function applyLang(l) { LANG = l; try { localStorage.setItem("svl-lang", l); } catch (e) {} renderAll(); }
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["guide", "obs", "colours", "quiz"].forEach(id => $("pane-" + id).hidden = id !== b.dataset.tab);
  if (b.dataset.tab === "quiz") b.classList.remove("ping");
  if (b.dataset.tab === "colours") renderReplay();
});

// controls
$("resetBtn").onclick = () => { const ans = S.answered; S = freshState(); S.answered = ans; $("screw").value = S.screw; $("screwOut").textContent = S.screw; $("quizTab").classList.remove("ping"); renderAll(); };
$("undoBtn").onclick = () => { if (S.sw) return toast("tWireOn", "danger"); S.wires.pop(); render(); };
$("clearBtn").onclick = () => { if (S.sw) return toast("tWireOn", "danger"); S.wires = []; render(); };
$("hintBtn").onclick = showHint;
$("swBtn").onclick = toggleSwitch;
$("revBtn").onclick = reversePol;
$("screw").oninput = e => { S.screw = +e.target.value; $("screwOut").textContent = S.screw; render(); };
$("dimBtn").onclick = () => { S.dim = !S.dim; render(); };
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("wheelBtn").onclick = () => { if (analyze().hv) return toast("tWheelOff", "danger"); S.wheelX = 680; S.wheelRot = 0; };
$("magBtn").onclick = () => { S.magnet.on = !S.magnet.on; if (S.magnet.on) { S.magnet.x = 770; S.magnet.y = 96; } render(); };
$("flipBtn").onclick = () => { S.magnet.pole *= -1; render(); };
$("strength").oninput = e => { S.strength = e.target.value / 100; $("strOut").textContent = e.target.value + "%"; renderLive(); };
$("plBtn").onclick = () => { S.plates.on = !S.plates.on; render(); };
$("plV").oninput = e => { S.plates.V = +e.target.value; $("plOut").textContent = (+e.target.value).toFixed(1) + " kV"; renderLive(); };
$("plPol").onchange = e => { S.plates.top = e.target.value === "top"; render(); };
$("replaySel").onchange = () => { playing = false; $("replay").value = 0; renderReplay(); };
$("replay").oninput = () => { playing = false; renderReplay(); };
$("playBtn").onclick = togglePlay;

// canvas pointer: wires, switch, magnet, safety
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / sc, y: (e.clientY - r.top - oy) / sc }; }
function nearTerm(p, r = 16) { let best = null, bd = r; for (const [k, q] of Object.entries(TERM)) { const d = Math.hypot(p.x - q.x, p.y - q.y); if (d < bd) { bd = d; best = k; } } return best; }
function wireAt(p) { for (let i = S.wires.length - 1; i >= 0; i--) { const w = S.wires[i]; for (let k = 1; k < 24; k++) { const [x, y] = bez(TERM[w.a], TERM[w.b], k / 24); if (Math.hypot(p.x - x, p.y - y) < 7) return i; } } return -1; }
cv.addEventListener("pointerdown", e => {
  const p = toLogical(e), A = analyze();
  if (S.mode === "slit" && S.magnet.on && Math.hypot(p.x - S.magnet.x, p.y - S.magnet.y) < 30) { S.magDrag = true; cv.setPointerCapture(e.pointerId); return; }
  const tk = nearTerm(p);
  if (tk) { if (S.sw) return toast("tWireOn", "danger"); S.drag = { from: tk, x: p.x, y: p.y }; cv.setPointerCapture(e.pointerId); return; }
  if (p.x > 196 && p.x < 312 && p.y > 380 && p.y < 472) return toggleSwitch();
  const wi = wireAt(p); if (wi >= 0) return removeWire(wi);
  if (A.hv && ((p.x > 596 && p.x < 950 && p.y > 110 && p.y < 310) || (p.x > 440 && p.x < 550 && p.y > 296 && p.y < 380))) return toast("tTouch", "danger", 4200);
});
cv.addEventListener("pointermove", e => {
  const p = toLogical(e);
  if (S.drag) { S.drag.x = p.x; S.drag.y = p.y; }
  if (S.magDrag) { S.magnet.x = Math.max(620, Math.min(920, p.x)); let y = Math.max(60, Math.min(440, p.y)); if (Math.abs(y - BY) < 62) y = y < BY ? BY - 62 : BY + 62; S.magnet.y = y; }
});
function endPointer(e) { if (S.drag) { const p = toLogical(e), tk = nearTerm(p, 20); const from = S.drag.from; S.drag = null; if (tk && tk !== from) addWire(from, tk); } S.magDrag = false; }
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", () => { S.drag = null; S.magDrag = false; });
cv.addEventListener("keydown", e => { if (!(S.mode === "slit" && S.magnet.on)) return; const d = 8; let used = true;
  if (e.key === "ArrowLeft") S.magnet.x -= d; else if (e.key === "ArrowRight") S.magnet.x += d; else if (e.key === "ArrowUp") S.magnet.y -= d; else if (e.key === "ArrowDown") S.magnet.y += d; else used = false;
  if (used) { e.preventDefault(); S.magnet.x = Math.max(620, Math.min(920, S.magnet.x)); S.magnet.y = Math.max(60, Math.min(440, S.magnet.y)); if (Math.abs(S.magnet.y - BY) < 62) S.magnet.y = S.magnet.y < BY ? BY - 62 : BY + 62; } });

readTokens(); resize(); S = freshState(); renderAll();
requestAnimationFrame(frame);
})();
</script>
