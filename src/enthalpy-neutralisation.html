  --ok:#6fc893; --ok-soft:#173326; --warn:#e6a35c; --warn-soft:#3a2812; --bad:#ef8a83; --bad-soft:#3d1d1b;
  --wall-top:#1a252b; --wall-bot:#10181c; --bench:#0a0f11; --bench-edge:#050809; --glass:rgba(200,225,235,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --surface-2:#1c282f; --ink:#e2eae8; --muted:#94a5aa; --line:#2b3940;

<div class="wrap">

<script>
// ---- NL: natural liquids (Beer–Lambert colour, absorbance mixing, depth shading, mixing plumes) + digital readouts ----
// Shared by every bench. All drawing functions take the canvas context explicitly.
var NL = window.NL || (window.NL = (() => {
  const BG = [251, 251, 248]; // white tile / white card behind the vessel
  const parse = c => { if (Array.isArray(c)) return c.slice(0, 3); if (c[0] === "#") return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const m = String(c).match(/[\d.]+/g) || [255, 255, 255]; return [+m[0], +m[1], +m[2]]; };

  if (n === N) saveScore(Math.round(s / N * 100)); const best = readScores()[SIM_ID];
  $("score").textContent = `${s} / ${N}` + (n < N ? " · " + t("scoreLeft", { n: N - n }) : "") + (best !== undefined ? " · " + t("best", { p: best }) : ""); }
$("retryBtn").onclick = () => { S.answered = {}; renderQuiz(); };
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  cv.setAttribute("aria-label", t("canvasAria"));
  $("appList").innerHTML = t("app").map(a => `<span>${esc(a)}</span>`).join(""); $("safeList").innerHTML = t("safe").map(a => `<li>${esc(a)}</li>`).join("");
  try { const st = JSON.parse(localStorage.getItem("svl-student") || "null"); if (st && st.name) { $("student").hidden = false; $("student").textContent = t("student", { name: st.name, cls: st.cls ? " · " + st.cls : "" }); } } catch (e) {}
}
function fullRender() { applyStatic(); render(); renderLog(); renderQuiz(); }
function applyLang(l) { LANG = l; try { localStorage.setItem("svl-lang", l); } catch (e) {} fullRender(); }
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  ["guide", "obs", "colours", "quiz"].forEach(id => $("pane-" + id).hidden = id !== b.dataset.tab);
  if (b.dataset.tab === "quiz") b.classList.remove("ping"); if (b.dataset.tab === "colours") { renderReplayCtl(); drawMini(); } });
$("gogBtn").onclick = () => { S.gog = !S.gog; render(); };
$("pairSel").onchange = e => choosePair(e.target.value);
$("resetBtn").onclick = () => { const ans = S.answered; S = freshState(); S.answered = ans; $("quizTab").classList.remove("ping"); fullRender(); };
$("replay").oninput = () => { playing = false; renderReplayCtl(); drawMini(); };
$("playBtn").onclick = () => { playing = !playing; if (playing && +$("replay").value >= 1000) $("replay").value = 0; renderReplayCtl(); };
// drag the extrapolation handles
let hDrag = null;
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / sc, y: (e.clientY - r.top - oy) / sc }; }
cv.addEventListener("pointerdown", e => { const r = R(); if (r.ph !== "graph") return; const p = toLogical(e);
  [["h1", H1T], ["h2", H2T]].forEach(([k, tt]) => { if (Math.hypot(p.x - gx(tt), p.y - gy(r[k])) < 22) hDrag = k; });
  if (hDrag) cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!hDrag) return; const p = toLogical(e); R()[hDrag] = gyInv(Math.max(G.y0, Math.min(G.y1, p.y))); renderPanel(); });
["pointerup", "pointercancel"].forEach(ev => cv.addEventListener(ev, () => { hDrag = null; }));
cv.addEventListener("keydown", e => { const r = R(); if (r.ph !== "graph") return; const d = { ArrowUp: .05, ArrowDown: -.05 }[e.key]; if (!d) return; e.preventDefault(); const k = e.shiftKey ? "h2" : "h1"; r[k] += d; renderPanel(); });

readTokens(); resize(); S = freshState(); fullRender(); NL.mountDigital(() => renderLive());
requestAnimationFrame(frame);
})();
